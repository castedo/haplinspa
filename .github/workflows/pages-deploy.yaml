name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read container image reference from file
        id: read-image
        run: |
          IMAGE="$(cat container-image.txt)"
          if [[ $IMAGE != docker://* ]]; then
            echo "::error file=container-image.txt::Not a 'docker:://*' reference inside container-image.txt"
            exit 1
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: "Generated PDF"
        uses: ${{ steps.read-image.outputs.image }}
        with:
          args: just build

      - name: "Upload HTML/PDF preview artifacts for GitHub Pages"
        uses: actions/upload-pages-artifact@v3
        with:
          path: _preview

  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-26.04
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
